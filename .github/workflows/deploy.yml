name: HUTECH CI/CD Build and Push

on:
  push:
    branches: [ "main" ] # Robot sẽ chạy mỗi khi bạn push code lên nhánh main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Lấy code từ GitHub về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java để build file .jar (vì bạn làm Spring Boot)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build file .jar bằng Maven
      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw clean package -DskipTests

      # 4. Đăng nhập vào Docker Hub bằng Secrets bạn vừa tạo
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build Image từ Dockerfile và Push lên Docker Hub cá nhân
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tên image sẽ là: giangsexy/ntg-app
          tags: ${{ secrets.DOCKER_USERNAME }}/ntg-app:latest